<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f4f2f8" />
<title>Cuenta · registro simple de gastos</title>
<style>
  /* ─── tokens ────────────────────────────────────────────────────────
     Derivados de las capturas de referencia: fondo lavanda-blanco,
     texto casi negro frío, rojo para gasto, verde para ingreso.
     Único lugar con valores de color literales. */
  :root {
    --bg:      oklch(0.968 0.009 300);
    --surface: oklch(0.995 0.003 300);
    --fg:      oklch(0.215 0.014 290);
    --muted:   oklch(0.545 0.016 290);
    --border:  oklch(0.895 0.011 300);
    --accent:  oklch(0.598 0.212 22);    /* gasto */

    /* derivados — no editar */
    --pos:         oklch(0.545 0.152 148); /* ingreso (color de estado) */
    --accent-soft: color-mix(in oklch, var(--accent) 12%, var(--surface));
    --pos-soft:    color-mix(in oklch, var(--pos) 13%, var(--surface));
    --fill:        color-mix(in oklch, var(--fg) 5%, transparent);
    --fill-strong: color-mix(in oklch, var(--fg) 9%, transparent);
    --scrim:       color-mix(in oklch, var(--fg) 42%, transparent);

    /* tipografía — display redondeada (iOS), cuerpo sans de sistema, mono tabular */
    --font-display: ui-rounded, 'SF Pro Rounded', 'Hiragino Maru Gothic ProN', 'Varela Round', system-ui, sans-serif;
    --font-body:    -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
    --font-mono:    ui-monospace, 'SF Mono', Menlo, monospace;

    --r-sm: 10px;
    --r-md: 16px;
    --r-lg: 24px;
    --r-xl: 34px;

    --shadow-sheet: 0 -8px 40px color-mix(in oklch, var(--fg) 16%, transparent);
    --shadow-fab:   0 6px 18px color-mix(in oklch, var(--accent) 34%, transparent);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: var(--font-body);
    color: var(--fg);
    background: var(--fg);
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; padding: 0; }
  :focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; border-radius: 6px; }
  .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }

  /* ─── escenario + marco del teléfono ─────────────────────────────── */
  .stage {
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 40px 20px;
    background:
      radial-gradient(120% 90% at 50% 0%, color-mix(in oklch, var(--fg) 80%, var(--accent)) 0%, var(--fg) 62%);
  }
  .stage-note {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em;
    text-transform: uppercase;
    color: color-mix(in oklch, var(--bg) 52%, transparent);
  }
  .device {
    position: relative;
    width: 390px; height: 844px;
    border-radius: 54px;
    padding: 11px;
    background: oklch(0.28 0.008 290);
    box-shadow:
      0 0 0 2px oklch(0.42 0.006 290),
      0 50px 90px -30px oklch(0.10 0.02 290);
    flex: none;
  }
  .screen {
    position: relative;
    width: 100%; height: 100%;
    border-radius: 44px;
    overflow: hidden;
    background: var(--bg);
    display: flex; flex-direction: column;
    isolation: isolate;
  }

  /* status bar + isla */
  .statusbar {
    flex: none;
    height: 54px;
    padding: 14px 30px 0;
    display: flex; align-items: flex-start; justify-content: space-between;
    font-size: 15px; font-weight: 600;
    letter-spacing: -0.01em;
  }
  .statusbar .sb-icons { display: flex; align-items: center; gap: 6px; }
  .island {
    position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
    width: 118px; height: 34px; border-radius: 20px;
    background: oklch(0.14 0.01 290);
    z-index: 5;
  }
  .homebar {
    flex: none; height: 26px;
    display: grid; place-items: center;
  }
  .homebar::after {
    content: ''; width: 138px; height: 5px; border-radius: 3px;
    background: color-mix(in oklch, var(--fg) 82%, transparent);
  }

  /* ─── app ─────────────────────────────────────────────────────────── */
  .app { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .appbar {
    flex: none;
    padding: 4px 22px 0;
    display: flex; justify-content: flex-end; gap: 4px;
  }
  .icon-btn {
    width: 44px; height: 44px; border-radius: 50%;
    display: grid; place-items: center;
    color: var(--muted);
    transition: background 0.15s ease, color 0.15s ease;
  }
  .icon-btn svg { width: 20px; height: 20px; }
  .icon-btn:hover, .icon-btn:focus-visible { background: var(--fill); color: var(--fg); }
  .icon-btn[aria-pressed="true"] { background: var(--fill-strong); color: var(--fg); }

  .scroll {
    flex: 1; min-height: 0;
    overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 104px;
  }
  .scroll::-webkit-scrollbar { width: 0; }

  /* resumen */
  .summary { padding: 2px 22px 0; }
  .summary-label {
    font-size: 13px; color: var(--muted);
    letter-spacing: 0.01em; margin: 0 0 2px;
  }
  .total {
    font-family: var(--font-display);
    font-variant-numeric: tabular-nums;
    font-size: 58px; font-weight: 700;
    line-height: 1.02; letter-spacing: -0.04em;
    margin: 0;
    display: flex; align-items: baseline; gap: 4px;
    min-height: 60px;
  }
  .total .cur { font-size: 26px; font-weight: 600; color: var(--muted); letter-spacing: -0.01em; }

  .kind-toggle {
    display: inline-flex; align-items: center; gap: 2px;
    margin-top: 12px;
    padding: 3px;
    border-radius: 999px;
    background: var(--fill);
  }
  .kind-toggle button {
    min-height: 38px;
    padding: 0 14px;
    border-radius: 999px;
    font-size: 14px; font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
    transition: background 0.16s ease, color 0.16s ease;
  }
  .kind-toggle button:hover { color: var(--fg); }
  .kind-toggle button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px color-mix(in oklch, var(--fg) 12%, transparent); }
  .kind-toggle button[data-kind="gasto"][aria-pressed="true"]   { background: var(--accent); color: var(--surface); }
  .kind-toggle button[data-kind="ingreso"][aria-pressed="true"] { background: var(--pos);    color: var(--surface); }

  .filters { display: flex; align-items: center; gap: 6px; margin-top: 14px; font-size: 13px; color: var(--muted); }
  .select-pill {
    position: relative;
    display: inline-flex; align-items: center; gap: 5px;
    min-height: 34px; padding: 0 10px;
    border-radius: 999px;
    background: var(--fill);
    font-size: 13px; font-weight: 600; color: var(--fg);
    transition: background 0.15s ease;
  }
  .select-pill:hover { background: var(--fill-strong); }
  .select-pill select {
    /* el inset negativo lleva el area tactil a 44px sin engordar la pildora */
    position: absolute; inset: -5px -4px; opacity: 0;
    appearance: none; border: 0; cursor: pointer;
  }
  .select-pill svg { width: 11px; height: 11px; flex: none; color: var(--muted); }

  /* búsqueda */
  .searchwrap { padding: 12px 22px 0; display: none; }
  .searchwrap.is-open { display: block; }
  .searchfield {
    display: flex; align-items: center; gap: 8px;
    height: 40px; padding: 0 12px;
    border-radius: 12px;
    background: var(--fill);
  }
  .searchfield svg { width: 16px; height: 16px; color: var(--muted); flex: none; }
  .searchfield input { flex: 1; border: 0; background: none; outline: none; font-size: 15px; min-width: 0; }
  .searchfield input::placeholder { color: var(--muted); }

  /* gráfico de gastos por categoría — barra proporcional + emoji, nada más */
  .catstrip {
    display: flex; align-items: flex-end; gap: 8px;
    margin-top: 22px; padding: 0 22px;
  }
  .catbar {
    flex: 1 1 0; min-width: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    padding: 0;
    transition: opacity 0.16s ease;
  }
  .catbar .fill {
    width: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
    gap: 5px;
    padding-bottom: 11px;
    border-radius: 16px;
    background: var(--fill-strong);
    transition: background 0.16s ease, height 0.3s cubic-bezier(0.32, 0.72, 0, 1);
  }
  .catbar .emo { font-size: 21px; line-height: 1; }
  .catbar .val {
    font-family: var(--font-mono); font-size: 11.5px; font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--fg);
    line-height: 13px;
  }
  /* la barra destacada va un punto mas oscura que --accent para que el monto
     en blanco mantenga 4.5:1 sobre ella */
  .catbar.is-top .fill,
  .catbar[aria-pressed="true"] .fill { background: color-mix(in oklch, var(--accent) 88%, black); }
  .catbar.is-top .val,
  .catbar[aria-pressed="true"] .val { color: var(--surface); }
  .catbar:hover .fill { background: color-mix(in oklch, var(--fg) 20%, transparent); }
  .catbar.is-top:hover .fill,
  .catbar[aria-pressed="true"]:hover .fill { background: color-mix(in oklch, var(--accent) 74%, black); }
  .catstrip.has-sel .catbar { opacity: 0.34; }
  .catstrip.has-sel .catbar[aria-pressed="true"] { opacity: 1; }
  .catbar:focus-visible { outline-offset: 4px; }

  /* lista */
  .list { padding: 20px 22px 0; }
  .daygroup + .daygroup { margin-top: 22px; }
  .dayhead {
    padding: 0 2px 8px;
    font-size: 12px; color: var(--muted);
  }
  .tx {
    width: 100%;
    display: flex; align-items: center; gap: 12px;
    min-height: 56px;
    padding: 8px 10px;
    border-radius: 14px;
    text-align: left;
    transition: background 0.15s ease;
  }
  .tx:hover, .tx:focus-visible { background: var(--surface); }
  .tx .emo {
    flex: none;
    width: 38px; height: 38px; border-radius: 12px;
    display: grid; place-items: center; font-size: 18px; line-height: 1;
  }
  .tx .body { flex: 1; min-width: 0; }
  .tx .t1 { display: block; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tx .t2 { display: block; font-size: 12px; color: var(--muted); line-height: 1.3; }
  .tx .amount {
    flex: none;
    font-family: var(--font-mono); font-variant-numeric: tabular-nums;
    font-size: 15px; font-weight: 600; letter-spacing: -0.02em;
  }
  .amount.neg { color: var(--fg); }
  .amount.pos { color: var(--pos); }
  .detail-rows .amount.neg { color: var(--accent); }

  .empty {
    margin: 48px 22px 0;
    padding: 34px 20px;
    border: 1.5px dashed var(--border);
    border-radius: var(--r-lg);
    text-align: center;
  }
  .empty p { margin: 0; font-size: 14px; color: var(--muted); }
  .empty strong { display: block; font-family: var(--font-display); font-size: 17px; color: var(--fg); margin-bottom: 4px; font-weight: 600; }

  /* barra inferior flotante */
  .dock {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 14px 22px 10px;
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(to top, var(--bg) 58%, transparent);
    z-index: 3;
  }
  .fab {
    width: 58px; height: 58px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--accent); color: var(--surface);
    box-shadow: var(--shadow-fab);
    transition: background 0.15s ease, transform 0.08s ease;
  }
  .fab svg { width: 26px; height: 26px; }
  .fab:hover { background: color-mix(in oklch, var(--accent) 88%, black); }
  .fab:active { transform: scale(0.94); }

  /* ─── hojas modales ───────────────────────────────────────────────── */
  .scrim {
    position: absolute; inset: 0; z-index: 8;
    background: var(--scrim);
    backdrop-filter: blur(2px);
    opacity: 0; pointer-events: none;
    transition: opacity 0.24s ease;
  }
  .scrim.is-open { opacity: 1; pointer-events: auto; }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 9;
    max-height: calc(100% - 44px);
    display: flex; flex-direction: column;
    background: var(--surface);
    border-radius: var(--r-xl) var(--r-xl) 0 0;
    box-shadow: var(--shadow-sheet);
    transform: translateY(102%);
    transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
  }
  .sheet.is-open { transform: translateY(0); }
  .sheet-grab { flex: none; padding: 9px 0 3px; display: grid; place-items: center; }
  .sheet-grab::after { content: ''; width: 38px; height: 5px; border-radius: 3px; background: var(--border); }
  .sheet-head {
    flex: none;
    display: flex; align-items: center; justify-content: space-between;
    padding: 2px 14px 0 22px;
  }
  .sheet-title { font-family: var(--font-display); font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
  .sheet-body { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 22px 0; }
  .sheet-body::-webkit-scrollbar { width: 0; }
  .sheet-foot { flex: none; padding: 12px 22px calc(12px + env(safe-area-inset-bottom)); }

  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; min-height: 50px;
    border-radius: var(--r-md);
    font-size: 16px; font-weight: 600; letter-spacing: -0.01em;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .btn svg { width: 17px; height: 17px; }
  .btn-primary { background: var(--fg); color: var(--surface); }
  .btn-primary:hover { background: color-mix(in oklch, var(--fg) 82%, var(--bg)); color: var(--surface); }
  .btn-primary:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }
  .btn-quiet { background: var(--fill); color: var(--fg); }
  .btn-quiet:hover { background: var(--fill-strong); }
  .btn-danger { background: var(--accent-soft); color: color-mix(in oklch, var(--accent) 78%, black); }
  .btn-danger:hover { background: color-mix(in oklch, var(--accent) 22%, var(--surface)); color: color-mix(in oklch, var(--accent) 82%, black); }

  /* hoja: nueva transacción */
  .pillrow { display: flex; gap: 7px; flex-wrap: wrap; }
  .pill {
    min-height: 40px; padding: 0 15px;
    border-radius: 999px;
    background: var(--fill);
    font-size: 13px; font-weight: 600; color: var(--muted);
    transition: background 0.15s ease, color 0.15s ease;
  }
  .pill:hover { background: var(--fill-strong); color: var(--fg); }
  .pill[aria-pressed="true"] { background: var(--fg); color: var(--surface); }

  .titlefield {
    width: 100%; border: 0; background: none; outline: none;
    margin-top: 16px;
    font-family: var(--font-display);
    font-size: 27px; font-weight: 700; letter-spacing: -0.025em;
  }
  .titlefield::placeholder { color: color-mix(in oklch, var(--muted) 62%, var(--surface)); }

  .amountrow {
    display: flex; align-items: center; gap: 10px;
    margin-top: 12px; padding-bottom: 10px;
    border-bottom: 1.5px solid var(--border);
    transition: border-color 0.15s ease;
  }
  .amountrow:focus-within { border-color: var(--fg); }
  .signswitch {
    display: inline-flex; align-items: center; gap: 2px;
    padding: 3px; border-radius: 999px;
    border: 1.5px solid var(--border);
  }
  .signswitch button {
    width: 42px; height: 38px; border-radius: 999px;
    display: grid; place-items: center;
    font-size: 17px; font-weight: 700; color: var(--muted);
    transition: background 0.15s ease, color 0.15s ease;
  }
  .signswitch button:hover { color: var(--fg); }
  .signswitch button[data-sign="-"][aria-pressed="true"] { background: var(--accent); color: var(--surface); }
  .signswitch button[data-sign="+"][aria-pressed="true"] { background: var(--pos);    color: var(--surface); }

  .amountcur {
    font-family: var(--font-display);
    font-size: 21px; font-weight: 600; color: var(--muted);
    letter-spacing: -0.01em;
  }
  .amountfield {
    flex: 1; min-width: 0;
    border: 0; background: none; outline: none; padding: 0;
    font-family: var(--font-display);
    font-variant-numeric: tabular-nums;
    font-size: 34px; font-weight: 700; letter-spacing: -0.035em;
    text-align: right;
  }
  .amountfield::placeholder { color: color-mix(in oklch, var(--muted) 55%, var(--surface)); }
  .amountfield.neg { color: var(--accent); }
  .amountfield.pos { color: var(--pos); }

  .catpicker { display: flex; gap: 7px; margin-top: 16px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .catpicker::-webkit-scrollbar { height: 0; }
  .catopt {
    flex: none;
    display: flex; align-items: center; gap: 7px;
    min-height: 44px; padding: 0 14px 0 10px;
    border-radius: 999px;
    border: 1.5px solid var(--border);
    font-size: 13.5px; font-weight: 600;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .catopt:hover { border-color: var(--muted); }
  .catopt[aria-pressed="true"] { border-color: var(--fg); background: var(--fill); }
  .catopt .emo { width: 24px; height: 24px; border-radius: 8px; display: grid; place-items: center; font-size: 13px; line-height: 1; }


  /* hoja: detalle */
  .detail-hero { display: flex; align-items: center; gap: 14px; padding: 8px 0 18px; }
  .detail-hero .emo { width: 52px; height: 52px; border-radius: var(--r-md); display: grid; place-items: center; font-size: 25px; line-height: 1; flex: none; }
  .detail-hero .t1 { display: block; font-family: var(--font-display); font-size: 21px; font-weight: 700; letter-spacing: -0.02em; }
  .detail-hero .t2 { display: block; font-size: 13px; color: var(--muted); }
  .detail-rows { border-top: 1px solid var(--border); }
  .drow {
    display: flex; align-items: center; justify-content: space-between;
    padding: 13px 2px;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }
  .drow dt { color: var(--muted); margin: 0; }
  .drow dd { margin: 0; font-weight: 600; }

  /* hoja: categorías */
  .catgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding-bottom: 6px; }
  .cattile {
    display: flex; flex-direction: column; align-items: flex-start; gap: 8px;
    padding: 12px;
    border-radius: var(--r-md);
    background: var(--fill);
    min-height: 92px;
  }
  .cattile .emo { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; font-size: 19px; line-height: 1; }
  .cattile .nm { display: block; font-size: 13px; font-weight: 600; letter-spacing: -0.005em; }
  .cattile .mt { display: block; font-family: var(--font-mono); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .cattile.add { border: 1.5px dashed var(--border); background: transparent; color: var(--muted); align-items: center; justify-content: center; }
  .cattile.add svg { width: 20px; height: 20px; }
  .cattile.add span { font-size: 12px; }

  /* hoja: ajustes */
  .setrow {
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
  }
  .setrow .lbl { font-size: 14.5px; font-weight: 600; }
  .setrow .hint { font-size: 12px; color: var(--muted); margin-top: 1px; }

  .toast {
    position: absolute; left: 50%; bottom: 86px; transform: translate(-50%, 10px);
    z-index: 12;
    padding: 10px 16px;
    border-radius: 999px;
    background: var(--fg); color: var(--bg);
    font-size: 13px; font-weight: 600;
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    white-space: nowrap;
  }
  .toast.is-open { opacity: 1; transform: translate(-50%, 0); }

  /* ─── móvil real: fuera el marco, app a pantalla completa ─────────── */
  @media (max-width: 520px) {
    .stage { padding: 0; min-height: 100dvh; background: var(--bg); display: block; }
    .stage-note { display: none; }
    .device {
      width: 100%; height: 100dvh;
      padding: 0; border-radius: 0; background: var(--bg); box-shadow: none;
    }
    .screen { border-radius: 0; }
    .island { display: none; }
    .statusbar { height: calc(20px + env(safe-area-inset-top)); padding: env(safe-area-inset-top) 22px 0; font-size: 13px; opacity: 0.55; }
    .homebar { height: calc(8px + env(safe-area-inset-bottom)); }
    .homebar::after { display: none; }
    .total { font-size: clamp(46px, 14vw, 58px); }
    .catgrid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>

<div class="stage" data-od-id="stage">
  <div class="device" data-od-id="device-frame">
    <div class="screen">
      <div class="island" aria-hidden="true"></div>

      <div class="statusbar" aria-hidden="true">
        <span id="clock">9:41</span>
        <span class="sb-icons">

<script>
(function () {
  'use strict';

  /* ── categorías ──────────────────────────────────────────────────── */
  var CATS = [
    { id: 'comida',    emo: '🍔', nm: 'Comida',     tint: 'oklch(0.86 0.09 62)'  },
    { id: 'transporte',emo: '🚌', nm: 'Transporte', tint: 'oklch(0.86 0.07 240)' },
    { id: 'casa',      emo: '🏠', nm: 'Casa',       tint: 'oklch(0.87 0.06 150)' },
    { id: 'compras',   emo: '🛍️', nm: 'Compras',    tint: 'oklch(0.86 0.08 340)' },
    { id: 'salud',     emo: '💊', nm: 'Salud',      tint: 'oklch(0.88 0.06 200)' },
    { id: 'ocio',      emo: '🎬', nm: 'Ocio',       tint: 'oklch(0.86 0.08 300)' },
    { id: 'sueldo',    emo: '💰', nm: 'Sueldo',     tint: 'oklch(0.89 0.08 95)'  },
    { id: 'otros',     emo: '📦', nm: 'Otros',      tint: 'oklch(0.90 0.01 290)' }
  ];
  var CAT_BY_ID = {};
  CATS.forEach(function (c) { CAT_BY_ID[c.id] = c; });

  /* ── estado ──────────────────────────────────────────────────────── */
  var KEY = 'cuenta.v1';
  var state = { currency: 'S/', tx: [] };
  var view  = { period: 'mes', kind: null, cat: null, q: '' };
  var draft = { sign: -1, digits: '', name: '', cat: 'comida', day: 0 };
  var openSheet = null;
  var detailId = null;

  function today() { var d = new Date(); d.setHours(12, 0, 0, 0); return d; }
  function dayShift(n) { var d = today(); d.setDate(d.getDate() - n); return d; }
  function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function uid() { return 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  function seed() {
    return [
      { id: uid(), name: 'Menú del día',        amount: -18,    cat: 'comida',     date: iso(dayShift(0)) },
      { id: uid(), name: 'Pasaje combi',        amount: -2.5,   cat: 'transporte', date: iso(dayShift(0)) },
      { id: uid(), name: 'Café con Ana',        amount: -14.9,  cat: 'ocio',       date: iso(dayShift(1)) },
      { id: uid(), name: 'Mercado de la semana',amount: -132.4, cat: 'comida',     date: iso(dayShift(1)) },
      { id: uid(), name: 'Recarga de celular',  amount: -30,    cat: 'otros',      date: iso(dayShift(2)) },
      { id: uid(), name: 'Zapatillas',          amount: -219,   cat: 'compras',    date: iso(dayShift(4)) },
      { id: uid(), name: 'Alquiler',            amount: -950,   cat: 'casa',       date: iso(dayShift(6)) },
      { id: uid(), name: 'Sueldo de agosto',    amount: 2800,   cat: 'sueldo',     date: iso(dayShift(6)) }
    ];
  }

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var p = JSON.parse(raw);
        if (p && Array.isArray(p.tx)) { state.tx = p.tx; state.currency = p.currency || 'S/'; return; }
      }
    } catch (e) { /* almacenamiento no disponible — seguimos en memoria */ }
    state.tx = seed();
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }

  /* ── formato ─────────────────────────────────────────────────────── */
  function sym() { return state.currency === '$COP' ? '$' : state.currency; }
  function nfmt(n) {
    return Math.abs(n).toLocaleString('es-PE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function money(n) { return sym() + ' ' + nfmt(n); }
  function signed(n) { return (n < 0 ? '−' : '+') + ' ' + sym() + ' ' + nfmt(n); }

  var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  var DIAS  = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

  function parseISO(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2], 12); }
  function dayLabel(s) {
    var d = parseISO(s), t = today();
    var diff = Math.round((t - d) / 86400000);
    if (diff === 0) return 'Hoy';
    if (diff === 1) return 'Ayer';
    if (diff < 7 && diff > 0) return DIAS[d.getDay()].charAt(0).toUpperCase() + DIAS[d.getDay()].slice(1);
    return d.getDate() + ' de ' + MESES[d.getMonth()];
  }
  function fullDate(s) {
    var d = parseISO(s);
    return DIAS[d.getDay()] + ', ' + d.getDate() + ' de ' + MESES[d.getMonth()] + ' de ' + d.getFullYear();
  }

  /* ── selección ───────────────────────────────────────────────────── */
  function inPeriod(tx) {
    if (view.period === 'todo') return true;
    var d = parseISO(tx.date), t = today();
    var m = t.getMonth(), y = t.getFullYear();
    if (view.period === 'anterior') {
      m -= 1; if (m < 0) { m = 11; y -= 1; }
    }
    return d.getMonth() === m && d.getFullYear() === y;
  }
  function periodRows() { return state.tx.filter(inPeriod); }
  function visibleRows() {
    var q = view.q.trim().toLowerCase();
    return periodRows().filter(function (t) {
      if (view.kind === 'gasto'   && t.amount >= 0) return false;
      if (view.kind === 'ingreso' && t.amount < 0)  return false;
      if (view.cat && t.cat !== view.cat) return false;
      if (q) {
        var cn = (CAT_BY_ID[t.cat] || {}).nm || '';
        if ((t.name + ' ' + cn).toLowerCase().indexOf(q) === -1) return false;
      }
      return true;
    }).sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
  }

  /* ── render ──────────────────────────────────────────────────────── */
  var $ = function (s) { return document.querySelector(s); };

  function renderSummary() {
    var rows = periodRows();
    var gasto = 0, ingreso = 0;
    rows.forEach(function (t) { if (t.amount < 0) gasto += -t.amount; else ingreso += t.amount; });
    var net = ingreso - gasto;

    /* el numero grande sigue al filtro activo: sin filtro es el balance del periodo */
    var head, color, lead;
    if (view.kind === 'gasto')        { head = -gasto;  color = 'var(--accent)'; lead = 'Gastos'; }
    else if (view.kind === 'ingreso') { head = ingreso; color = 'var(--pos)';    lead = 'Ingresos'; }
    else                              { head = net;     color = net < 0 ? 'var(--fg)' : 'var(--pos)'; lead = 'Balance'; }

    /* con una categoria seleccionada el titular muestra su gasto: asi cada
       barra da su cifra al tocarla, sin llenar el grafico de numeros */
    if (view.cat) {
      var catSum = 0;
      rows.forEach(function (t) { if (t.cat === view.cat && t.amount < 0) catSum += -t.amount; });
      head = -catSum;
      color = 'var(--accent)';
      lead = (CAT_BY_ID[view.cat] || {}).nm || 'Categoría';
    }

    $('#total-cur').textContent = sym();
    $('#total-num').textContent = (head < 0 ? '−' : '') + nfmt(head);
    $('#total').style.color = color;

    $('#sum-gasto').textContent   = ' ' + nfmt(gasto);
    $('#sum-ingreso').textContent = ' ' + nfmt(ingreso);

    var pl = { mes: 'este mes', anterior: 'mes pasado', todo: 'todo el historial' }[view.period];
    $('#summary-label').textContent = lead + ' · ' + pl;
    $('#period-label').textContent = { mes: 'Este mes', anterior: 'Mes pasado', todo: 'Todo' }[view.period];
    $('#count-hint').textContent = state.tx.length + (state.tx.length === 1 ? ' movimiento guardado' : ' movimientos guardados') + ' en este dispositivo';
  }

  /* El recuadro aloja el emoji, asi que tiene un zocalo fijo (BAR_BASE) y
     encima crece el tramo proporcional al gasto (hasta BAR_RANGE). */
  var BAR_BASE  = 70;   /* zocalo: emoji + monto + aire */
  var BAR_RANGE = 62;
  var BAR_TOP   = 5;  /* con recuadros de este tamano, 5 caben comodas en 390px */

  function renderCatStrip() {
    /* solo gastos: el sueldo no compite con las categorias de gasto */
    var byCat = {};
    periodRows().forEach(function (t) {
      if (t.amount < 0) byCat[t.cat] = (byCat[t.cat] || 0) + -t.amount;
    });

    var used = CATS.filter(function (c) { return byCat[c.id]; })
                   .sort(function (a, b) { return byCat[b.id] - byCat[a.id]; })
                   .slice(0, BAR_TOP);

    var strip = $('#catstrip');
    strip.innerHTML = '';
    if (!used.length) { strip.style.display = 'none'; return; }
    strip.style.display = 'flex';
    strip.classList.toggle('has-sel', !!view.cat);

    var top = byCat[used[0].id];

    used.forEach(function (c, i) {
      var amount = byCat[c.id];
      var h = BAR_BASE + Math.round((amount / top) * BAR_RANGE);
      var isSel = view.cat === c.id;
      /* un solo acento: la barra mayor, o la seleccionada si hay filtro */
      var isTop = view.cat ? false : i === 0;

      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'catbar' + (isTop ? ' is-top' : '');
      b.setAttribute('aria-pressed', isSel ? 'true' : 'false');
      b.setAttribute('data-od-id', 'catbar-' + c.id);
      b.setAttribute('aria-label', c.nm + ', ' + money(amount));
      b.title = c.nm + ' · ' + money(amount);
      b.innerHTML =
        '<span class="fill" style="height:' + h + 'px">' +
          '<span class="emo" aria-hidden="true">' + c.emo + '</span>' +
          '<span class="val">' + shortNum(amount) + '</span>' +
        '</span>';
      b.addEventListener('click', function () {
        view.cat = isSel ? null : c.id;
        render();
      });
      strip.appendChild(b);
    });
  }

  function shortNum(n) {
    if (n >= 1000) return (n / 1000).toFixed(n >= 10000 ? 0 : 1).replace('.', ',') + 'k';
    return Math.round(n).toString();
  }

  function renderList() {
    var rows = visibleRows();
    var host = $('#list');
    host.innerHTML = '';

    if (!rows.length) {
      var e = document.createElement('div');
      e.className = 'empty';
      var hasAny = state.tx.length > 0;
      e.innerHTML = hasAny
        ? '<p><strong>Nada por aquí</strong>Ningún movimiento coincide con el filtro actual.</p>'
        : '<p><strong>Aún no registras nada</strong>Toca el botón + y anota tu primer movimiento.</p>';
      host.appendChild(e);
      return;
    }

    var groups = [], idx = {};
    rows.forEach(function (t) {
      if (!(t.date in idx)) { idx[t.date] = groups.length; groups.push({ date: t.date, items: [] }); }
      groups[idx[t.date]].items.push(t);
    });

    groups.forEach(function (g) {
      var sec = document.createElement('section');
      sec.className = 'daygroup';

      var head = document.createElement('div');
      head.className = 'dayhead';
      head.textContent = dayLabel(g.date);
      sec.appendChild(head);

      g.items.forEach(function (t) {
        var c = CAT_BY_ID[t.cat] || CAT_BY_ID.otros;
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'tx';
        b.setAttribute('data-od-id', 'tx-' + t.id);
        b.innerHTML =
          '<span class="emo" style="background:' + c.tint + '">' + c.emo + '</span>' +
          '<span class="body"><span class="t1">' + esc(t.name) + '</span><span class="t2">' + c.nm + '</span></span>' +
          '<span class="amount ' + (t.amount < 0 ? 'neg' : 'pos') + '">' + signed(t.amount) + '</span>';
        b.addEventListener('click', function () { showDetail(t.id); });
        sec.appendChild(b);
      });

      host.appendChild(sec);
    });
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (m) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m];
    });
  }

  function renderKindChips() {
    $('#chip-gasto').setAttribute('aria-pressed', view.kind === 'gasto' ? 'true' : 'false');
    $('#chip-ingreso').setAttribute('aria-pressed', view.kind === 'ingreso' ? 'true' : 'false');
  }

  function render() {
    renderSummary();
    renderKindChips();
    renderCatStrip();
    renderList();
    renderCatGrid();
  }

  /* ── hojas ───────────────────────────────────────────────────────── */
  function open(id) {
    if (openSheet) $(openSheet).classList.remove('is-open');
    openSheet = id;
    $('#scrim').classList.add('is-open');
    $(id).classList.add('is-open');
  }
  function close() {
    if (openSheet) $(openSheet).classList.remove('is-open');
    openSheet = null;
    $('#scrim').classList.remove('is-open');
  }
  $('#scrim').addEventListener('click', close);
  Array.prototype.forEach.call(document.querySelectorAll('[data-close]'), function (b) {
    b.addEventListener('click', close);
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && openSheet) close(); });

  var toastTimer;
  function toast(msg) {
    var t = $('#toast');
    t.textContent = msg;
    t.classList.add('is-open');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('is-open'); }, 1900);
  }

  /* ── hoja nueva transacción ──────────────────────────────────────── */
  /* El monto se escribe con el teclado normal del telefono (inputmode decimal).
     Solo saneamos: digitos, un separador decimal, dos decimales. */
  function cleanAmount(raw) {
    var v = String(raw).replace(/[^0-9.,]/g, '').replace(/,/g, '.');
    var parts = v.split('.');
    if (parts.length > 1) v = parts.shift() + '.' + parts.join('').slice(0, 2);
    v = v.replace(/^0+(?=\d)/, '');
    if (v.split('.')[0].length > 9) v = v.split('.')[0].slice(0, 9) + (v.indexOf('.') > -1 ? '.' + v.split('.')[1] : '');
    return v;
  }
  function renderDraftAmount() {
    var el = $('#new-amount');
    el.className = 'amountfield ' + (draft.sign < 0 ? 'neg' : 'pos');
    $('#new-cur').textContent = sym();
    $('#btn-save').disabled = !(draftValue() > 0);
  }
  function draftValue() { return Math.round((parseFloat(draft.digits || '0') || 0) * 100) / 100; }

  function renderDraftCats() {
    var host = $('#new-cats');
    host.innerHTML = '';
    CATS.forEach(function (c) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'catopt';
      b.setAttribute('aria-pressed', draft.cat === c.id ? 'true' : 'false');
      b.setAttribute('data-od-id', 'newcat-' + c.id);
      b.innerHTML = '<span class="emo" style="background:' + c.tint + '">' + c.emo + '</span>' + c.nm;
      b.addEventListener('click', function () { draft.cat = c.id; renderDraftCats(); });
      host.appendChild(b);
    });
  }

  function resetDraft() {
    draft = { sign: -1, digits: '', name: '', cat: 'comida', day: 0 };
    $('#new-name').value = '';
    Array.prototype.forEach.call(document.querySelectorAll('.signswitch button'), function (b) {
      b.setAttribute('aria-pressed', b.dataset.sign === '-' ? 'true' : 'false');
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-day]'), function (b) {
      b.setAttribute('aria-pressed', b.dataset.day === '0' ? 'true' : 'false');
    });
    $('#new-amount').value = '';
    renderDraftCats();
    renderDraftAmount();
  }

  $('#btn-add').addEventListener('click', function () {
    resetDraft();
    $('#pill-antier').textContent = dayLabel(iso(dayShift(2)));
    open('#sheet-new');
    setTimeout(function () { $('#new-name').focus(); }, 320);
  });

  Array.prototype.forEach.call(document.querySelectorAll('.signswitch button'), function (b) {
    b.addEventListener('click', function () {
      draft.sign = b.dataset.sign === '-' ? -1 : 1;
      Array.prototype.forEach.call(document.querySelectorAll('.signswitch button'), function (o) {
        o.setAttribute('aria-pressed', o === b ? 'true' : 'false');
      });
      if (draft.sign > 0 && draft.cat !== 'sueldo' && draft.cat !== 'otros') { draft.cat = 'sueldo'; renderDraftCats(); }
      renderDraftAmount();
    });
  });

  Array.prototype.forEach.call(document.querySelectorAll('[data-day]'), function (b) {
    b.addEventListener('click', function () {
      draft.day = Number(b.dataset.day);
      Array.prototype.forEach.call(document.querySelectorAll('[data-day]'), function (o) {
        o.setAttribute('aria-pressed', o === b ? 'true' : 'false');
      });
    });
  });

  $('#new-amount').addEventListener('input', function () {
    var c = cleanAmount(this.value);
    if (c !== this.value) this.value = c;
    draft.digits = c;
    renderDraftAmount();
  });
  /* al salir del campo se formatea a dos decimales */
  $('#new-amount').addEventListener('blur', function () {
    var v = draftValue();
    if (v > 0) { this.value = v.toFixed(2); draft.digits = String(v); }
  });
  /* Enter guarda, como en cualquier formulario corto */
  $('#new-amount').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); this.blur(); $('#btn-save').click(); }
  });
  $('#new-name').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); $('#new-amount').focus(); }
  });

  $('#new-name').addEventListener('input', function () { draft.name = this.value; });

  $('#btn-save').addEventListener('click', function () {
    var v = draftValue();
    if (!(v > 0)) return;
    var cat = CAT_BY_ID[draft.cat] || CAT_BY_ID.otros;
    state.tx.push({
      id: uid(),
      name: draft.name.trim() || cat.nm,
      amount: draft.sign * v,
      cat: draft.cat,
      date: iso(dayShift(draft.day))
    });
    save();
    close();
    view.cat = null;
    view.kind = null;
    view.period = 'mes';
    $('#period').value = 'mes';
    render();
    $('#scroll').scrollTo({ top: 0, behavior: 'smooth' });
    toast(draft.sign < 0 ? 'Gasto registrado' : 'Ingreso registrado');
  });

  /* ── hoja detalle ────────────────────────────────────────────────── */
  function showDetail(id) {
    var t = state.tx.filter(function (x) { return x.id === id; })[0];
    if (!t) return;
    detailId = id;
    var c = CAT_BY_ID[t.cat] || CAT_BY_ID.otros;
    $('#detail-body').innerHTML =
      '<div class="detail-hero">' +
        '<span class="emo" style="background:' + c.tint + '">' + c.emo + '</span>' +
        '<span><span class="t1">' + esc(t.name) + '</span><span class="t2">' + c.nm + '</span></span>' +
      '</div>' +
      '<dl class="detail-rows">' +
        '<div class="drow"><dt>Monto</dt><dd class="' + (t.amount < 0 ? 'amount neg' : 'amount pos') + '">' + signed(t.amount) + '</dd></div>' +
        '<div class="drow"><dt>Tipo</dt><dd>' + (t.amount < 0 ? 'Gasto' : 'Ingreso') + '</dd></div>' +
        '<div class="drow"><dt>Fecha</dt><dd>' + fullDate(t.date) + '</dd></div>' +
      '</dl>';
    open('#sheet-detail');
  }

  $('#btn-delete').addEventListener('click', function () {
    state.tx = state.tx.filter(function (x) { return x.id !== detailId; });
    save();
    close();
    render();
    toast('Movimiento eliminado');
  });

  /* ── hoja categorías ─────────────────────────────────────────────── */
  function renderCatGrid() {
    var rows = periodRows();
    var byCat = {};
    rows.forEach(function (t) { byCat[t.cat] = (byCat[t.cat] || 0) + Math.abs(t.amount); });

    var host = $('#catgrid');
    host.innerHTML = '';
    CATS.forEach(function (c) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'cattile';
      b.setAttribute('data-od-id', 'cattile-' + c.id);
      b.innerHTML =
        '<span class="emo" style="background:' + c.tint + '">' + c.emo + '</span>' +
        '<span><span class="nm">' + c.nm + '</span><span class="mt">' + (byCat[c.id] ? money(byCat[c.id]) : '—') + '</span></span>';
      b.addEventListener('click', function () {
        view.cat = c.id;
        close();
        render();
        $('#scroll').scrollTo({ top: 0, behavior: 'smooth' });
        toast('Filtrando: ' + c.nm);
      });
      host.appendChild(b);
    });

    var add = document.createElement('button');
    add.type = 'button';
    add.className = 'cattile add';
    add.setAttribute('data-od-id', 'cattile-add');
    add.innerHTML =
      '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M10 4.5v11M4.5 10h11"/></svg>' +
      '<span>Añadir</span>';
    add.addEventListener('click', function () { toast('Categorías personalizadas: pendiente'); });
    host.appendChild(add);
  }

  $('#btn-cats').addEventListener('click', function () { renderCatGrid(); open('#sheet-cats'); });

  /* ── ajustes ─────────────────────────────────────────────────────── */
  $('#btn-settings').addEventListener('click', function () { renderSummary(); open('#sheet-settings'); });
  $('#currency').addEventListener('change', function () {
    state.currency = this.value;
    $('#cur-label').textContent = sym();
    save();
    render();
    renderDraftAmount();
  });
  $('#btn-reset').addEventListener('click', function () {
    state.tx = seed();
    save();
    close();
    view = { period: 'mes', kind: null, cat: null, q: '' };
    $('#period').value = 'mes';
    $('#search').value = '';
    render();
    toast('Datos restablecidos');
  });

  /* ── filtros de la pantalla principal ────────────────────────────── */
  $('#period').addEventListener('change', function () { view.period = this.value; view.cat = null; render(); });

  Array.prototype.forEach.call(document.querySelectorAll('.kind-toggle button'), function (b) {
    b.addEventListener('click', function () {
      view.kind = view.kind === b.dataset.kind ? null : b.dataset.kind;
      render();
    });
  });

  $('#btn-search').addEventListener('click', function () {
    var wrap = $('#searchwrap');
    var isOpen = wrap.classList.toggle('is-open');
    this.setAttribute('aria-pressed', isOpen ? 'true' : 'false');
    if (isOpen) { $('#search').focus(); }
    else { $('#search').value = ''; view.q = ''; render(); }
  });
  $('#search').addEventListener('input', function () { view.q = this.value; renderList(); });

  /* ── reloj del status bar ────────────────────────────────────────── */
  function tick() {
    var d = new Date();
    $('#clock').textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  tick();
  setInterval(tick, 20000);

  /* ── arranque ────────────────────────────────────────────────────── */
  load();
  $('#currency').value = state.currency;
  $('#cur-label').textContent = sym();
  resetDraft();
  render();
})();
</script>
</body>
</html>
