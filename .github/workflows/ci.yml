name: CI

on:
  push:
    branches: [master]
  pull_request:

# un push nuevo a la misma rama cancela la ejecución anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # El build importa los módulos del servidor pero no se conecta a nada:
      # valores de relleno, nunca secretos reales. La observabilidad queda
      # desactivada (sin DSN ni claves), que es el modo por defecto de la app.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-placeholder-not-a-secret
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_BETTER_AUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.6.0
          cache: true

      - uses: actions/setup-node@v7
        with:
          # Prisma 7 soporta Node 20.19+, 22.12+ y 24+
          node-version: 24

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
